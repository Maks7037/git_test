<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визначні місця</title>
    <style>
        /* Основні стилі */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: #1a1a1a; 
            color: #ffffff; 
            text-align: center; 
            overflow: hidden;
            height: 100vh;
        }

        /* Вибір країни та мови зверху екрану */
        .country-selector {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 15px;
            align-items: center;
        }
        label {
            font-size: 1em;
            color: #ffcc00;
        }
        select {
            padding: 8px 15px;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ffcc00;
            background: #333;
            color: white;
            cursor: pointer;
        }

        /* Розмитий фон */
        .slide-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.35);
            transform: scale(1.1);
            z-index: -1;
        }

        /* Налаштування слайдів (додано прокрутку та відступ знизу для кнопок) */
        .slide { 
            display: none; 
            height: 100vh; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            padding-bottom: 100px; /* Запас знизу, щоб кнопки не перекривали контент */
            box-sizing: border-box; 
            animation: fadeIn 0.5s ease-in-out;
            position: relative;
            overflow-y: auto; /* Дозволяє скролити сторінку вниз, якщо контент високий */
        }
        .slide.active { 
            display: flex; 
        }
        
        img { 
            max-width: 80%; 
            max-height: 45vh; 
            border-radius: 15px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            margin-bottom: 15px; 
            object-fit: cover; 
            position: relative;
            z-index: 2;
        }
        h1 { 
            font-size: 2.2em; 
            margin-bottom: 10px; 
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            position: relative;
            z-index: 2;
        }
        p { 
            font-size: 1.3em; 
            max-width: 800px; 
            line-height: 1.4;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            position: relative;
            z-index: 2;
            margin: 0 0 15px 0;
        }

        /* Список посилань у кінці */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            max-height: 50vh;
            overflow-y: auto;
            text-align: left;
            position: relative;
            z-index: 2;
            min-width: 400px;
        }
        .links-container a {
            color: #ffcc00;
            text-decoration: none;
            font-size: 1.2em;
            transition: color 0.3s, transform 0.2s;
            display: block;
        }
        .links-container a:hover {
            color: #ffffff;
            transform: translateX(10px);
        }

        /* Кнопки навігації */
        .controls { 
            position: fixed; 
            bottom: 20px; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            z-index: 10000; 
            pointer-events: auto;
        }
        button { 
            padding: 10px 22px; 
            font-size: 1.1em; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background: rgba(68, 68, 68, 0.85); 
            color: white; 
            transition: background 0.3s;
            backdrop-filter: blur(5px);
        }
        button:hover { 
            background: rgba(102, 102, 102, 0.95); 
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Меню вибору країни та мови -->
    <div class="country-selector">
        <div>
            <label for="country-select">Country:</label>
            <select id="country-select" onchange="updatePresentation()">
                <option value="czechia">Czechia (Чехія)</option>
                <option value="switzerland">Switzerland (Швейцарія)</option>
            </select>
        </div>
        <div>
            <label for="lang-select">Language:</label>
            <select id="lang-select" onchange="updatePresentation()">
                <option value="uk">Українська</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <!-- Контейнер для слайдів -->
    <div id="slides-container"></div>

    <!-- Кнопки навігації -->
    <div class="controls">
        <button onclick="prevSlide()" id="btn-back">◀ Back</button>
        <button onclick="nextSlide()" id="btn-forward">Forward ▶</button>
    </div>

    <script>
        // ДАНІ ДЛЯ КРАЇН З ДВОМА МОВАМИ
        const countriesData = {
            czechia: {
                title: {
                    uk: "Визначні місця Чехії",
                    en: "Top 10 Famous Places in Czechia"
                },
                subtitle: {
                    uk: "Короткий огляд найкращих локацій",
                    en: "A brief overview of the best locations"
                },
                moreTitle: {
                    uk: "Детальніше про кожне місце:",
                    en: "Learn more about each place:"
                },
                places: [
                    { img: "krkonose.jpeg", title: { uk: "1. Національний парк Крконоше", en: "1. Krkonoše National Park" }, desc: { uk: "Найвищий гірський хребет Чехії з захоплюючими льодовиковими долинами та водоспадами.", en: "Czechia's highest mountain range featuring breathtaking glacial valleys and waterfalls." }, link: "https://en.wikipedia.org/wiki/Krkonoše_National_Park" },
                    { img: "MoravianKarst.jpeg", title: { uk: "2. Моравський крас", en: "2. Moravian Karst" }, desc: { uk: "Приголомшливий заповідник дикої природи, відомий величною прірвою Мацоха та підземними прогулянками на човнах.", en: "A stunning natural reserve featuring the massive Macocha Abyss and underground boat rides." }, link: "https://en.wikipedia.org/wiki/Moravian_Karst" },
                    { img: "Krumlov.jpeg", title: { uk: "3. Чеський Крумлов", en: "3. Český Krumlov" }, desc: { uk: "Казкове середньовічне містечко під охороною ЮНЕСКО.", en: "A fairytale medieval town protected by UNESCO." }, link: "https://uk.wikipedia.org/wiki/Чеський_Крумлов" },
                    { img: "Hluboka.jpeg", title: { uk: "4. Замок Глубока", en: "4. Hluboká Castle" }, desc: { uk: "Один із найромантичніших і найгарніших замків Чехії.", en: "One of the most romantic and beautiful castles in Czechia." }, link: "https://uk.wikipedia.org/wiki/Глубока_(замок)" },
                    { img: "hora.webp", title: { uk: "5. Кутна Гора", en: "5. Kutná Hora" }, desc: { uk: "Місто готичної архітектури, всесвітньо відоме завдяки Кістниці.", en: "A city of Gothic architecture, world-famous for its Ossuary (Bone Church)." }, link: "https://uk.wikipedia.org/wiki/Кутна-Гора" },
                    { img: "KarlovyVary.jpeg", title: { uk: "6. Карлові Вари", en: "6. Karlovy Vary" }, desc: { uk: "Всесвітньо відоме курортне місто з цілющими джерелами.", en: "A world-famous spa town with healing mineral springs." }, link: "https://uk.wikipedia.org/wiki/Карлові_Вари" },
                    { img: "BohemianSwitzerland.jpeg", title: { uk: "7. Чеська Швейцарія", en: "7. Bohemian Switzerland" }, desc: { uk: "Мальовнича природа з величними пісковиковими скелями.", en: "Picturesque nature with majestic sandstone rocks." }, link: "https://uk.wikipedia.org/wiki/Чеська_Швейцарія" },
                    { img: "Karlstejn.jpeg", title: { uk: "8. Замок Карлштейн", en: "8. Karlštejn Castle" }, desc: { uk: "Готичний замок XIV століття, збудований імператором Карлом IV.", en: "A 14th-century Gothic castle built by Emperor Charles IV." }, link: "https://uk.wikipedia.org/wiki/Карлштейн" },
                    { img: "Lednice.jpeg", title: { uk: "9. Ледніцько-Валтицький ареал", en: "9. Lednice-Valtice Cultural Landscape" }, desc: { uk: "Грандіозний ландшафтний парк із розкішними палацами.", en: "A grand landscape park with luxurious palaces." }, link: "https://uk.wikipedia.org/wiki/Ледніцько-Валтицький_ареал" },
                    { img: "Telc.jpeg", title: { uk: "10. Містечко Тельч", en: "10. Telč" }, desc: { uk: "Казкове мальовниче містечко з вражаючою центральною площею доби Відродження XVI століття.", en: "A picturesque fairytale town with a stunning 16th-century Renaissance main square." }, link: "https://en.wikipedia.org/wiki/Telč" }
                ]
            },
            switzerland: {
                title: {
                    uk: "Визначні місця Швейцарії",
                    en: "Top 10 Famous Places in Switzerland"
                },
                subtitle: {
                    uk: "Короткий огляд найкращих локацій",
                    en: "A brief overview of the best locations"
                },
                moreTitle: {
                    uk: "Детальніше про кожне місце:",
                    en: "Learn more about each place:"
                },
                places: [
                    { img: "Matterhorn.jpeg", title: { uk: "1. Маттергорн", en: "1. Matterhorn" }, desc: { uk: "Культова пірамідальна гірська вершина висотою 4478 м у Церматті.", en: "Iconic 4,478m pyramid-shaped mountain peak in Zermatt." }, link: "https://uk.wikipedia.org/wiki/Маттергорн" },
                    { img: "Jungfraujoch.jpeg", title: { uk: "2. Юнгфрауйох", en: "2. Jungfraujoch" }, desc: { uk: "Найвища залізнична станція в Європі з видом на льодовик Алеч.", en: "Europe’s highest railway station with views of the Aletsch Glacier." }, link: "https://uk.wikipedia.org/wiki/Юнгфрауйох" },
                    { img: "Lauterbrunnen Valley.jpeg", title: { uk: "3. Долина Лаутербруннен", en: "3. Lauterbrunnen Valley" }, desc: { uk: "Мальовнича альпійська долина, відома своїми скелями та 72 водоспадами.", en: "Scenic Alpine valley famous for its cliffs and 72 waterfalls." }, link: "https://uk.wikipedia.org/wiki/Лаутербруннен" },
                    { img: "Chillon Castle.jpeg", title: { uk: "4. Шийонський замок", en: "4. Chillon Castle" }, desc: { uk: "Історична середньовічна фортеця на Женевському озері.", en: "Historic medieval fortress located on Lake Geneva." }, link: "https://uk.wikipedia.org/wiki/Шийонський_замок" },
                    { img: "kapel.jpeg", title: { uk: "5. Капелльбрюкке", en: "5. Kapellbrücke" }, desc: { uk: "Найстаріший критий дерев'яний міст у Європі в Люцерні.", en: "Europe’s oldest covered wooden bridge in Lucerne." }, link: "https://uk.wikipedia.org/wiki/Капелльбрюкке" },
                    { img: "Rhine Falls.jpeg", title: { uk: "6. Рейнський водоспад", en: "6. Rhine Falls" }, desc: { uk: "Найбільший рівнинний водоспад Європи поблизу Шаффгаузена.", en: "Europe’s largest plain waterfall located near Schaffhausen." }, link: "https://uk.wikipedia.org/wiki/Рейнський_водоспад" },
                    { img: "Bern Old Town.jpeg", title: { uk: "7. Старе місто Берна", en: "7. Bern Old Town" }, desc: { uk: "Центр спадщини ЮНЕСКО з середньовічними аркадами та вежею з годинником Цитглогге.", en: "UNESCO heritage center with medieval arcades and the Zytglogge clock tower." }, link: "https://uk.wikipedia.org/wiki/Старе_місто_(Берн)" },
                    { img: "Lake Geneva.jpeg", title: { uk: "8. Женевське озеро", en: "8. Lake Geneva" }, desc: { uk: "Відоме озеро з культовим 140-метровим фонтаном Же-До.", en: "Famous lake with the iconic 140-meter Jet d'Eau fountain." }, link: "https://uk.wikipedia.org/wiki/Женевське_озеро" },
                    { img: "Glacier Express.jpeg", title: { uk: "9. Льодовиковий експрес", en: "9. Glacier Express" }, desc: { uk: "Легендарні панорамні залізничні маршрути через Альпи.", en: "Legendary panoramic train routes through the Alps." }, link: "https://uk.wikipedia.org/wiki/Льодовиковий_експрес" },
                    { img: "Lindt Home of Chocolate.png", title: { uk: "10. Дім шоколаду Lindt", en: "10. Lindt Home of Chocolate" }, desc: { uk: "Інтерактивний музей шоколаду біля Цюриха з велетенським шоколадним фонтаном.", en: "Interactive chocolate museum near Zurich with a giant chocolate fountain." }, link: "https://en.wikipedia.org/wiki/Lindt_%26_Sprüngli" }
                ]
            }
        };

        let currentSlide = 0;
        let slidesElements = [];

        function updatePresentation() {
            const countryKey = document.getElementById('country-select').value;
            const langKey = document.getElementById('lang-select').value;
            const data = countriesData[countryKey];
            const container = document.getElementById('slides-container');
            let html = '';
            
            const defaultBg = data.places[0].img;

            document.getElementById('btn-back').innerText = langKey === 'uk' ? '◀ Назад' : '◀ Back';
            document.getElementById('btn-forward').innerText = langKey === 'uk' ? 'Вперед ▶' : 'Forward ▶';

            // 1. Титульний слайд
            html += `
                <div class="slide active">
                    <div class="slide-bg" style="background-image: url('${defaultBg}');"></div>
                    <h1>${data.title[langKey]}</h1>
                    <p>${data.subtitle[langKey]}</p>
                </div>
            `;

            // 2. Слайди з місцями
            data.places.forEach(place => {
                html += `
                    <div class="slide">
                        <div class="slide-bg" style="background-image: url('${place.img}');"></div>
                        <img src="${place.img}" alt="${place.title[langKey]}">
                        <h1>${place.title[langKey]}</h1>
                        <p>${place.desc[langKey]}</p>
                    </div>
                `;
            });

            // 3. Фінальний слайд з посиланнями
            html += `
                <div class="slide">
                    <div class="slide-bg" style="background-image: url('${defaultBg}');"></div>
                    <h1>${data.moreTitle[langKey]}</h1>
                    <div class="links-container">
                        ${data.places.map(place => `<a href="${place.link}" target="_blank">${place.title[langKey]} 🔗</a>`).join('')}
                    </div>
                </div>
            `;

            container.innerHTML = html;
            slidesElements = document.querySelectorAll('.slide');
            currentSlide = 0;
        }

        window.showSlide = function(index) {
            slidesElements.forEach((slide, i) => {
                slide.classList.remove('active');
                if (i === index) slide.classList.add('active');
            });
        };

        window.nextSlide = function() {
            currentSlide = (currentSlide + 1) % slidesElements.length;
            showSlide(currentSlide);
        };

        window.prevSlide = function() {
            currentSlide = (currentSlide - 1 + slidesElements.length) % slidesElements.length;
            showSlide(currentSlide);
        };
        
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight') nextSlide();
            if (event.key === 'ArrowLeft') prevSlide();
        });

        document.addEventListener('DOMContentLoaded', () => {
            updatePresentation();
        });
    </script>
</body>
</html>
