<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визначні місця</title>
    <style>
        /* Основні стилі */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: #1a1a1a; 
            color: #ffffff; 
            text-align: center; 
            overflow: hidden;
            height: 100vh;
        }

        /* Вибір країни зверху екрану */
        .country-selector {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        select {
            padding: 8px 15px;
            font-size: 1.2em;
            border-radius: 5px;
            border: 1px solid #ffcc00;
            background: #333;
            color: white;
            cursor: pointer;
        }

        /* Розмитий фон */
        .slide-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.35); /* Сильне розмиття та затемнення */
            transform: scale(1.1); /* Забираємо білі краї */
            z-index: -1;
        }

        /* Налаштування слайдів */
        .slide { 
            display: none; 
            height: 100vh; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            box-sizing: border-box; 
            animation: fadeIn 0.5s ease-in-out;
            position: relative;
        }
        .slide.active { 
            display: flex; 
        }
        
        img { 
            max-width: 80%; 
            max-height: 50vh; 
            border-radius: 15px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.7);
            margin-bottom: 20px; 
            object-fit: cover; 
            position: relative;
            z-index: 2;
        }
        h1 { 
            font-size: 2.5em; 
            margin-bottom: 10px; 
            color: #ffcc00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            position: relative;
            z-index: 2;
        }
        p { 
            font-size: 1.5em; 
            max-width: 800px; 
            line-height: 1.4;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            position: relative;
            z-index: 2;
        }

        /* Список посилань у кінці */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            max-height: 60vh;
            overflow-y: auto;
            text-align: left;
            position: relative;
            z-index: 2;
            min-width: 400px;
        }
        .links-container a {
            color: #ffcc00;
            text-decoration: none;
            font-size: 1.3em;
            transition: color 0.3s, transform 0.2s;
            display: block;
        }
        .links-container a:hover {
            color: #ffffff;
            transform: translateX(10px);
        }

        /* Кнопки "Вперед / Назад" */
        .controls { 
            position: fixed; 
            bottom: 30px; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            z-index: 10000; 
            pointer-events: auto;
        }
        button { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background: rgba(68, 68, 68, 0.8); 
            color: white; 
            transition: background 0.3s;
            backdrop-filter: blur(5px);
        }
        button:hover { 
            background: rgba(102, 102, 102, 0.9); 
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Меню вибору країни -->
    <div class="country-selector">
        <label for="country-select">Select a country: </label>
        <select id="country-select" onchange="changeCountry()">
            <option value="switzerland">Switzerland(Швейцарія)</option>
            <option value="czechia">Czech Republic(Чехія)</option>
        </select>
    </div>

    <!-- Контейнер для слайдів (генерується скриптом) -->
    <div id="slides-container"></div>

    <!-- Кнопки навігації -->
    <div class="controls">
        <button onclick="prevSlide()">◀ Back</button>
        <button onclick="nextSlide()">Forward ▶</button>
    </div>

    <script>
        // ДАНІ ДЛЯ КРАЇН: тут ви можете додавати інші країни або міняти фото та текст
        const countriesData = {
            switzerland: {
                name: "Швейцарії",
                places: [
                    { img: "Matterhorn.jpeg", title: "1. Matterhorn", desc: "Iconic 4,478m pyramid-shaped mountain peak in Zermatt.", link: "https://uk.wikipedia.org/wiki/Маттергорн" },
                    { img: "Jungfraujoch.jpeg", title: "2. Jungfraujoch", desc: "Europe’s highest railway station with views of the Aletsch Glacier.", link: "https://uk.wikipedia.org/wiki/Юнгфрауйох" },
                    { img: "Lauterbrunnen Valley.jpeg", title: "3. Lauterbrunnen Valley", desc: "Scenic Alpine valley famous for its cliffs and 72 waterfalls.", link: "https://uk.wikipedia.org/wiki/Лаутербруннен" },
                    { img: "Chillon Castle.jpeg", title: "4. Chillon Castle", desc: "Historic medieval fortress located on Lake Geneva.", link: "https://uk.wikipedia.org/wiki/Шийонський_замок" },
                    { img: "kapel.jpeg", title: "5. Kapellbrücke", desc: "Europe’s oldest covered wooden bridge in Lucerne.", link: "https://uk.wikipedia.org/wiki/Капелльбрюкке" },
                    { img: "Rhine Falls.jpeg", title: "6. Rhine Falls", desc: "Europe’s largest plain waterfall located near Schaffhausen.", link: "https://uk.wikipedia.org/wiki/Рейнський_водоспад" },
                    { img: "Bern Old Town.jpeg", title: "7. Bern Old Town", desc: "UNESCO heritage center with medieval arcades and the Zytglogge clock tower.", link: "https://uk.wikipedia.org/wiki/Старе_місто_(Берн)" },
                    { img: "Lake Geneva.jpeg", title: "8. Lake Geneva", desc: "Famous lake with the iconic 140-meter Jet d'Eau fountain.", link: "https://uk.wikipedia.org/wiki/Женевське_озеро" },
                    { img: "Glacier Express.jpeg", title: "9. Glacier Express", desc: "Legendary panoramic train routes through the Alps.", link: "https://uk.wikipedia.org/wiki/Льодовиковий_експрес" },
                    { img: "Lindt Home of Chocolate.png", title: "10. Lindt Home of Chocolate", desc: "Interactive chocolate museum near Zurich with a giant chocolate fountain.", link: "https://en.wikipedia.org/wiki/Lindt_%26_Sprüngli" }
                ]
            },
            czechia: {
                name: "Чехії",
                places: [
                    { img: "krkonose.jpeg", title: "1. Національний парк Крконоше", desc: "Найвищий гірський хребет Чехії з захоплюючими льодовиковими долинами та водоспадами.", link: "https://en.wikipedia.org/wiki/Krkonoše_National_Park" },
                    { img: "MoravianKarst.jpeg", title: "2. Моравський крас", desc: "Приголомшливий заповідник дикої природи, відомий величною прірвою Мацоха та підземними прогулянками на човнах.", link: "https://en.wikipedia.org/wiki/Moravian_Karst" },
                    { img: "Krumlov.jpeg", title: "3. Чеський Крумлов", desc: "Казкове середньовічне містечко під охороною ЮНЕСКО.", link: "https://uk.wikipedia.org/wiki/Чеський_Крумлов" },
                    { img: "Hluboka.jpeg", title: "4. Замок Глубока", desc: "Один із найромантичніших і найгарніших замків Чехії.", link: "https://uk.wikipedia.org/wiki/Глубока_(замок)" },
                    { img: "hora.webp", title: "5. Кутна Гора", desc: "Місто готичної архітектури, всесвітньо відоме завдяки Кістниці.", link: "https://uk.wikipedia.org/wiki/Кутна-Гора" },
                    { img: "KarlovyVary.jpeg", title: "6. Карлові Вари", desc: "Всесвітньо відоме курортне місто з цілющими джерелами.", link: "https://uk.wikipedia.org/wiki/Карлові_Вари" },
                    { img: "BohemianSwitzerland.jpeg", title: "7. Чеська Швейцарія", desc: "Мальовнича природа з величними пісковиковими скелями.", link: "https://uk.wikipedia.org/wiki/Чеська_Швейцарія" },
                    { img: "Karlstejn.jpeg", title: "8. Замок Карлштейн", desc: "Готичний замок XIV століття, збудований імператором Карлом IV.", link: "https://uk.wikipedia.org/wiki/Карлштейн" },
                    { img: "Lednice.jpeg", title: "9. Ледніцько-Валтицький ареал", desc: "Грандіозний ландшафтний парк із розкішними палацами.", link: "https://uk.wikipedia.org/wiki/Ледніцько-Валтицький_ареал" },
                    { img: "Telc.jpeg", title: "10. Містечко Тельч", desc: "Казкове мальовниче містечко з вражаючою центральною площею доби Відродження XVI століття.", link: "https://en.wikipedia.org/wiki/Telč" },
                ]
            }
        };

        let currentSlide = 0;
        let slidesElements = [];

        // Функція, яка бере дані з об'єкта вище і створює HTML-код слайдів
        function renderSlides(countryKey) {
            const data = countriesData[countryKey];
            const container = document.getElementById('slides-container');
            let html = '';
            
            // Беремо першу картинку для фону титульного та фінального слайду
            const defaultBg = data.places[0].img;

            // 1. Титульний слайд
            html += `
                <div class="slide active">
                    <div class="slide-bg" style="background-image: url('${defaultBg}');"></div>
                    <h1>Top 10 Famous Places in ${data.name === "Швейцарії" ? "Switzerland" : "Czechia"}</h1>
                    <p>A brief overviewn of the best locations</p>
                </div>
            `;

            // 2. Слайди з місцями
            data.places.forEach(place => {
                html += `
                    <div class="slide">
                        <div class="slide-bg" style="background-image: url('${place.img}');"></div>
                        <img src="${place.img}" alt="${place.title}">
                        <h1>${place.title}</h1>
                        <p>${place.desc}</p>
                    </div>
                `;
            });

            // 3. Фінальний слайд з посиланнями
            html += `
                <div class="slide">
                    <div class="slide-bg" style="background-image: url('${defaultBg}');"></div>
                    <h1>Детальніше про кожне місце:</h1>
                    <div class="links-container">
                        ${data.places.map(place => `<a href="${place.link}" target="_blank">${place.title} 🔗</a>`).join('')}
                    </div>
                </div>
            `;

            // Вставляємо все на сторінку
            container.innerHTML = html;
            slidesElements = document.querySelectorAll('.slide');
            currentSlide = 0;
        }

        // Запуск при виборі зі списку
        function changeCountry() {
            const selectedCountry = document.getElementById('country-select').value;
            renderSlides(selectedCountry);
        }

        // Логіка перемикання слайдів
        window.showSlide = function(index) {
            slidesElements.forEach((slide, i) => {
                slide.classList.remove('active');
                if (i === index) slide.classList.add('active');
            });
        };

        window.nextSlide = function() {
            currentSlide = (currentSlide + 1) % slidesElements.length;
            showSlide(currentSlide);
        };

        window.prevSlide = function() {
            currentSlide = (currentSlide - 1 + slidesElements.length) % slidesElements.length;
            showSlide(currentSlide);
        };
        
        // Кнопки на клавіатурі
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowRight') nextSlide();
            if (event.key === 'ArrowLeft') prevSlide();
        });

        // Запускаємо першу країну під час відкриття сторінки
        document.addEventListener('DOMContentLoaded', () => {
            changeCountry();
        });
    </script>
</body>
</html>
